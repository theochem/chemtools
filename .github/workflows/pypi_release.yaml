name: PyPI Release

on:
  push:
    tags:
      # Trigger on version tags (e.g., v1.0.0)
      - "v*.*.*"
      # Trigger on pre-release tags (e.g., v1.0.0-alpha.1)
      - "v*.*.*-*"

env:
  # PYPI_NAME: ${{ github.event.repository.name }}
  PYPI_NAME: qc-${{ github.event.repository.name }}

jobs:
  build:
    name: Build and Test Distribution
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        # python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        python-version: ["3.12"]
    outputs:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path

          requirements = Path("requirements.txt")
          lines = requirements.read_text(encoding="utf-8").splitlines()
          kept = []
          removed = []

          for line in lines:
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  kept.append(line)
                  continue
              normalized = stripped.lower()
              is_vcs_ref = (
                  " @ git+" in normalized
                  or normalized.startswith(("git+", "hg+", "svn+", "bzr+"))
              )
              if is_vcs_ref:
                  removed.append(line)
                  continue
              kept.append(line)

          requirements.write_text("\n".join(kept) + "\n", encoding="utf-8")
          if removed:
              print("Removed direct URL dependencies from packaging metadata:")
              for item in removed:
                  print(f" - {item}")
          PY
          python -m pip install "git+https://github.com/theochem/denspart"
          python -m pip install build pytest pytest-cov
          python -m pip install ".[dev]"
      - name: Test package
        run: |
          # python -m pytest -c pyproject.toml --cov-config=.coveragerc --cov-report=xml --color=yes chemtools

      - name: Build package
        run: python -m build

      - name: Verify metadata has no direct URL dependencies
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          violations = []

          wheel_paths = glob.glob("dist/*.whl")
          if not wheel_paths:
              raise SystemExit("No wheel found in dist/")
          wheel_path = wheel_paths[0]
          with zipfile.ZipFile(wheel_path) as wheel:
              metadata_name = [name for name in wheel.namelist() if name.endswith("METADATA")][0]
              metadata_text = wheel.read(metadata_name).decode("utf-8", errors="replace")
          for line in metadata_text.splitlines():
              if line.startswith("Requires-Dist:") and " @ " in line and "git+" in line.lower():
                  violations.append(f"{wheel_path}: {line}")

          sdist_paths = glob.glob("dist/*.tar.gz")
          if not sdist_paths:
              raise SystemExit("No sdist found in dist/")
          sdist_path = sdist_paths[0]
          with tarfile.open(sdist_path, "r:gz") as sdist:
              pkg_info_member = next(member for member in sdist.getmembers() if member.name.endswith("PKG-INFO"))
              pkg_info_text = sdist.extractfile(pkg_info_member).read().decode("utf-8", errors="replace")
          for line in pkg_info_text.splitlines():
              if line.startswith("Requires-Dist:") and " @ " in line and "git+" in line.lower():
                  violations.append(f"{sdist_path}: {line}")

          if violations:
              print("Detected direct URL dependencies in built metadata:")
              for item in violations:
                  print(item)
              sys.exit(1)
          print("Metadata verification passed: no direct URL dependencies found.")
          PY

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          overwrite: false
          include-hidden-files: false

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: PyPI-Release
      url: https://pypi.org/p/${{ env.PYPI_NAME }}
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: Sign and Upload Python Distribution to GitHub Release
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --notes ""
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'

